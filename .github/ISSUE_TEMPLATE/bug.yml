name: Bug report
description: Report a Dibber integration problem using sanitized details
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues first. Never attach raw captures, backups, tokens,
        credentials, child identifiers, event text, screenshots, or complete debug
        logs. Use fictional examples. This integration has no diagnostics dump.
  - type: input
    attributes:
      label: Home Assistant and Dibber integration versions
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
      description: Describe the problem without personal information.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: Include only the steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Sanitized error category
      description: For example cannot_connect, invalid_auth, or a skipped-item count.
      render: text
  - type: checkboxes
    attributes:
      label: Privacy
      options:
        - label: I reviewed this report and removed credentials and personal data.
          required: true
